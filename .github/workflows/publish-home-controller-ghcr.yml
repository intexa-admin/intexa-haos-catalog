name: Publish private Home Controller image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA from al-29/home-controller
        required: true
        type: string
      version:
        description: Exact HAOS app version to publish
        required: true
        type: string
      confirm:
        description: Type PUBLISH to authorize this release
        required: true
        type: string

concurrency:
  group: publish-home-controller-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/intexa-admin/home-controller
  BUILD_VERSION: ${{ inputs.version }}

jobs:
  validate-build-publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out distribution metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate immutable release inputs
        shell: bash
        run: |
          [[ "${{ inputs.source_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -qx "version: ${{ inputs.version }}" home_controller/config.yaml
          grep -qx 'image: "ghcr.io/intexa-admin/home-controller"' home_controller/config.yaml
          grep -Fqx '  "version": "${{ inputs.version }}",' distribution.json
          grep -Fqx '  "sourceCommit": "${{ inputs.source_sha }}",' distribution.json

      - name: Check out private application source read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: al-29/home-controller
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_REPOSITORY_SSH_KEY }}
          persist-credentials: false
          path: source

      - name: Verify exact source revision
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "${{ inputs.source_sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Build and validate the HAOS application payload
        working-directory: source
        run: |
          cp ../home_controller/config.yaml home-assistant-app/home-controller/config.yaml
          npm run package:ha-app
          npm run validate:haos-image-context -- --expected-version "${{ inputs.version }}"

      - name: Verify release version coherence
        run: node .github/scripts/verify-release-versions.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to private GHCR namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source/home-assistant-app/home-controller
          file: source/home-assistant-app/home-controller/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/intexa-admin/intexa-haos-catalog
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan release image for known vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ inputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Publish scanned immutable image
        shell: bash
        run: docker push "${IMAGE}:${BUILD_VERSION}"
